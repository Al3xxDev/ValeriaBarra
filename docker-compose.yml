services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: valeria_barra
      POSTGRES_USER: valeria
      POSTGRES_PASSWORD: valeria
    ports:
      - "5432:5432"
    volumes:
      - valeria-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valeria -d valeria_barra"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  valeria-postgres:
