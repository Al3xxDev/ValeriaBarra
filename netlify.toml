[build]
  command = 'if [ "$CONTEXT" = "production" ] && { [ -n "$NETLIFY_DB_URL" ] || [ -n "$DATABASE_URL" ]; }; then npm run db:deploy; if [ -n "$ADMIN_EMAIL" ] && [ -n "$ADMIN_PASSWORD" ]; then NODE_ENV=production npm run db:seed; fi; fi && npm run build'
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "true"
